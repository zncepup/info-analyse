<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>投资信息分析系统</title>
  <style>
    /* ===== iOS Design System Tokens ===== */
    :root {
      --system-bg: #F2F2F7;
      --grouped-bg: #FFFFFF;
      --label: #000000;
      --label-secondary: #3C3C43;
      --label-tertiary: #3C3C4399;
      --label-quaternary: #3C3C434D;
      --separator: #3C3C4336;
      --separator-opaque: #C6C6C8;
      --fill-tertiary: #7676801F;
      --fill-quaternary: #74748014;
      --tint: #007AFF;
      --tint-bg: rgba(0,122,255,0.12);
      --green: #34C759;
      --green-bg: rgba(52,199,89,0.12);
      --orange: #FF9500;
      --orange-bg: rgba(255,149,0,0.12);
      --red: #FF3B30;
      --red-bg: rgba(255,59,48,0.12);
      --blue-bg: rgba(0,122,255,0.12);
      --card-radius: 12px;
      --cell-radius: 10px;
      --page-inset: 16px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* ===== Reset & Base ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
                   "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
      font-size: 15px;
      line-height: 1.47;
      color: var(--label);
      background: var(--system-bg);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }

    /* ===== Page Container ===== */
    .page {
      max-width: 700px;
      margin: 0 auto;
      padding: 0 var(--page-inset) 100px;
    }

    /* ===== Navigation Bar ===== */
    .nav-bar {
      position: sticky; top: 0; z-index: 20;
      background: rgba(242,242,247,0.88);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      backdrop-filter: saturate(180%) blur(20px);
      margin: 0 calc(-1 * var(--page-inset));
      padding: 0 var(--page-inset);
    }
    .nav-bar-inner {
      display: flex; align-items: center; justify-content: space-between;
      height: 44px;
      border-bottom: 0.5px solid var(--separator);
    }
    .nav-title {
      display: flex; align-items: center; gap: 10px;
      font-size: 17px; font-weight: 600;
    }
    .nav-logo {
      width: 30px; height: 30px; border-radius: 7px;
      background: linear-gradient(135deg, #007AFF, #5856D6);
      display: grid; place-items: center;
      color: #fff; font-weight: 700; font-size: 12px;
      letter-spacing: -0.5px;
    }
    .nav-action {
      width: 36px; height: 36px; border-radius: 50%;
      border: none; background: transparent; color: var(--tint);
      display: grid; place-items: center; cursor: pointer;
      transition: background 0.15s;
    }
    .nav-action:active { background: var(--fill-tertiary); }

    /* ===== Section ===== */
    .section { margin-top: 24px; }
    .section-header {
      display: flex; align-items: baseline; justify-content: space-between;
      padding: 0 4px 6px;
      font-size: 13px; font-weight: 400;
      color: var(--label-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }
    .section-action {
      border: none; background: none; color: var(--tint);
      font-size: 13px; font-weight: 400; cursor: pointer;
      padding: 4px 0;
    }
    .section-action:active { opacity: 0.5; }

    /* ===== Card (iOS Grouped) ===== */
    .card {
      background: var(--grouped-bg);
      border-radius: var(--card-radius);
      overflow: hidden;
    }
    .card-label {
      padding: 14px 16px 2px;
      font-size: 15px; font-weight: 600;
      color: var(--label);
    }
    .card-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    }

    /* ===== Cell (iOS List Row) ===== */
    .cell-group { display: flex; flex-direction: column; }
    .cell {
      display: flex; align-items: center; justify-content: space-between;
      min-height: 44px; padding: 0 16px;
    }
    .cell + .cell { border-top: 0.5px solid var(--separator); margin-left: 16px; padding-left: 0; }
    .cell-label { font-size: 15px; color: var(--label); }
    .cell-value { font-size: 15px; color: var(--label-tertiary); }

    /* ===== Forms ===== */
    .form-group { margin-bottom: 12px; padding: 0 16px; }
    .form-group:last-of-type { margin-bottom: 14px; }
    .form-label {
      display: block; font-size: 13px; color: var(--label-tertiary);
      margin-bottom: 5px; padding-left: 2px;
    }
    .form-input {
      width: 100%; height: 44px;
      padding: 0 12px;
      border: none;
      border-radius: var(--cell-radius);
      background: var(--system-bg);
      font-family: inherit; font-size: 15px; color: var(--label);
      transition: box-shadow 0.2s;
      -webkit-appearance: none; appearance: none;
    }
    .form-input:focus {
      outline: none;
      box-shadow: 0 0 0 3.5px rgba(0,122,255,0.3);
    }
    .form-input::placeholder { color: var(--label-quaternary); }
    select.form-input {
      background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='%233C3C4399' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 12px center;
      padding-right: 32px;
    }

    /* ===== Toggle (iOS Switch) ===== */
    .toggle-cell {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 15px; color: var(--label);
    }
    .ios-switch { position: relative; display: inline-block; width: 51px; height: 31px; flex-shrink: 0; }
    .ios-switch input { opacity: 0; width: 0; height: 0; position: absolute; }
    .switch-track {
      position: absolute; inset: 0; cursor: pointer;
      background: #E9E9EB; border-radius: 31px;
      transition: background 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .switch-track::after {
      content: ""; position: absolute;
      width: 27px; height: 27px; left: 2px; top: 2px;
      background: #fff; border-radius: 50%;
      box-shadow: 0 3px 8px rgba(0,0,0,0.15), 0 1px 1px rgba(0,0,0,0.06);
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .ios-switch input:checked + .switch-track { background: var(--green); }
    .ios-switch input:checked + .switch-track::after { transform: translateX(20px); }

    /* ===== Buttons ===== */
    .ios-btn {
      display: inline-flex; align-items: center; justify-content: center;
      height: 44px; padding: 0 20px;
      border: none; border-radius: var(--cell-radius);
      font-family: inherit; font-size: 15px; font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.1s;
      -webkit-appearance: none;
    }
    .ios-btn:active { transform: scale(0.97); opacity: 0.7; }
    .ios-btn:disabled { opacity: 0.35; pointer-events: none; }
    .ios-btn-tint { background: var(--tint); color: #fff; }
    .ios-btn-plain { background: var(--fill-tertiary); color: var(--tint); }
    .ios-btn-ghost { background: transparent; color: var(--tint); height: auto; padding: 6px 12px; font-size: 13px; font-weight: 500; }
    .ios-btn-ghost:active { background: var(--fill-quaternary); }
    .ios-btn-danger { background: transparent; color: var(--red); height: auto; padding: 6px 12px; font-size: 13px; font-weight: 500; }
    .ios-btn-danger:active { background: var(--red-bg); }
    .ios-btn-full { width: calc(100% - 32px); margin: 0 16px 16px; }
    .ios-btn-sm { height: 32px; padding: 0 14px; font-size: 13px; border-radius: 8px; }

    /* ===== QR Zone ===== */
    .qr-zone { padding: 14px 16px; }
    .qr-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .qr-actions .ios-btn { height: 36px; font-size: 14px; padding: 0 16px; }
    .qr-state { font-size: 13px; color: var(--label-tertiary); }
    .qr-img {
      width: 200px; margin-top: 12px;
      border-radius: var(--cell-radius);
      border: 0.5px solid var(--separator);
      display: none;
    }
    .qr-message { font-size: 13px; color: var(--label-tertiary); margin-top: 6px; }

    /* ===== List ===== */
    .list { list-style: none; }
    .list-cell {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      min-height: 44px; padding: 10px 16px;
      font-size: 15px;
      transition: background 0.15s;
    }
    .list-cell:active { background: var(--fill-quaternary); }
    .list-cell + .list-cell { border-top: 0.5px solid var(--separator); margin-left: 16px; padding-left: 0; }
    .list-cell.empty {
      justify-content: center; color: var(--label-tertiary);
      font-size: 15px; min-height: 60px;
    }
    .list-cell.empty:active { background: transparent; }

    /* Task cells */
    .task-cell { flex-direction: column; align-items: stretch; gap: 6px; }
    .task-cell:active { background: transparent; }
    .task-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .task-title { font-size: 15px; font-weight: 500; flex: 1; min-width: 0; }
    .task-sub { font-size: 13px; color: var(--label-tertiary); margin-top: 1px; }
    .tag {
      display: inline-flex; align-items: center;
      padding: 2px 8px; border-radius: 6px;
      font-size: 12px; font-weight: 600; white-space: nowrap;
      letter-spacing: 0.01em;
    }
    .tag-ok { background: var(--green-bg); color: var(--green); }
    .tag-err { background: var(--orange-bg); color: var(--orange); }
    .tag-run { background: var(--blue-bg); color: var(--tint); }
    .tag-pending { background: var(--fill-tertiary); color: var(--label-tertiary); }

    /* Progress */
    .progress-track {
      width: 100%; height: 4px;
      background: var(--fill-tertiary); border-radius: 2px;
      overflow: hidden; margin-top: 4px;
    }
    .progress-fill {
      height: 100%; border-radius: 2px;
      background: var(--tint);
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .progress-meta {
      font-size: 12px; color: var(--label-tertiary);
      margin-top: 4px; line-height: 1.4;
    }
    .phase-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 6px; margin-top: 8px;
    }
    .phase-chip {
      padding: 8px 10px; border-radius: 8px;
      background: var(--system-bg); font-size: 12px;
    }
    .phase-name { font-weight: 600; color: var(--label); margin-bottom: 4px; }
    .phase-bar {
      display: flex; align-items: center; gap: 6px;
    }
    .phase-track {
      flex: 1; height: 3px; background: var(--fill-tertiary);
      border-radius: 1.5px; overflow: hidden;
    }
    .phase-track-fill {
      height: 100%; border-radius: 1.5px;
      transition: width 0.3s ease;
    }
    .phase-count { font-size: 11px; color: var(--label-tertiary); white-space: nowrap; }
    .phase-detail { font-size: 11px; color: var(--label-tertiary); margin-top: 2px; }

    /* Completed items disclosure */
    .disclosure-btn {
      display: flex; align-items: center; gap: 4px;
      border: none; background: none; color: var(--tint);
      font-size: 13px; font-weight: 400; cursor: pointer;
      padding: 4px 0; margin-top: 4px;
    }
    .disclosure-btn:active { opacity: 0.5; }
    .disclosure-btn svg { transition: transform 0.2s; }
    .disclosure-btn.open svg { transform: rotate(90deg); }
    .disclosure-list {
      display: none; margin-top: 4px; padding: 8px 10px;
      background: var(--system-bg); border-radius: 8px;
      font-size: 13px; color: var(--label-secondary);
      max-height: 160px; overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .disclosure-list.open { display: block; }
    .disclosure-list div { padding: 3px 0; }
    .disclosure-list div + div { border-top: 0.5px solid var(--separator); }

    /* File cells */
    .file-cell { flex-direction: column; align-items: stretch; gap: 4px; }
    .file-cell:active { background: transparent; }
    .file-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .file-info { flex: 1; min-width: 0; }
    .file-link {
      font-size: 15px; font-weight: 500; color: var(--tint);
      text-decoration: none; display: block;
      overflow: hidden; text-overflow: ellipsis;
    }
    .file-link:active { opacity: 0.5; }
    .file-meta { font-size: 13px; color: var(--label-tertiary); margin-top: 2px; }
    .file-actions { display: flex; gap: 4px; flex-shrink: 0; padding-top: 2px; }

    /* Pagination */
    .pager {
      display: flex; align-items: center; justify-content: center; gap: 16px;
      padding: 12px 16px; font-size: 13px; color: var(--label-tertiary);
    }
    .pager-btn {
      border: none; background: none; color: var(--tint);
      font-size: 15px; font-weight: 400; cursor: pointer;
      padding: 6px 0;
    }
    .pager-btn:disabled { color: var(--label-quaternary); cursor: default; }
    .pager-btn:active:not(:disabled) { opacity: 0.5; }

    /* ===== Toast (iOS HUD) ===== */
    .ios-toast {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      background: rgba(60,60,67,0.85);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      backdrop-filter: saturate(180%) blur(20px);
      color: #fff; font-size: 15px; font-weight: 500;
      padding: 14px 24px; border-radius: 14px;
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 100; text-align: center;
      max-width: 280px;
    }
    .ios-toast.show {
      opacity: 1; transform: translate(-50%, -50%) scale(1);
    }

    /* ===== Tab Bar ===== */
    .tab-bar {
      display: none;
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
      background: rgba(249,249,249,0.94);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      backdrop-filter: saturate(180%) blur(20px);
      border-top: 0.5px solid var(--separator);
      padding: 4px 0 var(--safe-bottom);
    }
    .tab-bar-inner {
      display: flex; justify-content: space-around;
      max-width: 500px; margin: 0 auto;
    }
    .tab-item {
      display: flex; flex-direction: column; align-items: center;
      gap: 1px; padding: 4px 0;
      text-decoration: none; color: var(--label-tertiary);
      font-size: 10px; font-weight: 500;
      min-width: 64px;
      transition: color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .tab-item:active { color: var(--tint); }
    .tab-icon { width: 24px; height: 24px; }

    /* ===== Responsive ===== */
    @media (max-width: 700px) {
      .card-grid { grid-template-columns: 1fr; gap: 8px; }
      .nav-bar { position: sticky; }
      .tab-bar { display: flex; flex-direction: column; }
      .page { padding-bottom: calc(80px + var(--safe-bottom)); }
      .phase-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
    }
    @media (min-width: 701px) {
      .page { padding-top: 8px; }
      .tab-bar { display: none !important; }
    }

    /* ===== Animations ===== */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .section { animation: fadeIn 0.3s ease both; }
    .section:nth-child(2) { animation-delay: 0.05s; }
    .section:nth-child(3) { animation-delay: 0.1s; }
    .section:nth-child(4) { animation-delay: 0.15s; }
    .section:nth-child(5) { animation-delay: 0.2s; }
</style>
</head>
<body>
<div class="page">

  <!-- ===== Navigation Bar (iOS Large Title style) ===== -->
  <header class="nav-bar">
    <div class="nav-bar-inner">
      <div class="nav-title">
        <div class="nav-logo" aria-hidden="true">IA</div>
        <span>投资信息分析</span>
      </div>
      <button class="nav-action" onclick="refreshAll()" aria-label="刷新全部">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3.5 10a6.5 6.5 0 0 1 11.48-4.16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M16.5 10a6.5 6.5 0 0 1-11.48 4.16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M15 3v3h-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 17v-3h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <!-- ===== Login Status ===== -->
  <section class="section" id="login-section">
    <div class="section-header">登录状态</div>
    <div class="card">
      <div class="cell-group">
        <div class="cell">
          <span class="cell-label">登录状态</span>
          <span class="cell-value" id="status-login">--</span>
        </div>
        <div class="cell">
          <span class="cell-label">Cookies</span>
          <span class="cell-value" id="status-cookies">--</span>
        </div>
      </div>
    </div>
    <div class="card" style="margin-top:8px">
      <div class="qr-zone">
        <div class="qr-actions">
          <button class="ios-btn ios-btn-tint" onclick="startQrLogin()">扫码登录</button>
          <button class="ios-btn ios-btn-plain" onclick="stopQrLogin()">结束会话</button>
          <span class="qr-state" id="qr-login-state"></span>
        </div>
        <img id="qr-login-image" class="qr-img" alt="QR">
        <div class="qr-message" id="qr-login-message"></div>
      </div>
    </div>
  </section>

  <!-- ===== Crawl Actions ===== -->
  <section class="section" id="crawl-section">
    <div class="section-header">数据抓取</div>
    <div class="card-grid">
      <!-- Fetch by URL -->
      <div class="card">
        <div class="card-label">抓取链接</div>
        <form id="fetch-form">
          <div class="form-group">
            <label class="form-label" for="fetch-url">知乎链接</label>
            <input class="form-input" id="fetch-url" name="url" placeholder="https://www.zhihu.com/question/..." required>
          </div>
          <div class="form-group">
            <div class="toggle-cell">
              <span>抓取评论</span>
              <label class="ios-switch"><input type="checkbox" id="fetch-with-comments" checked><span class="switch-track"></span></label>
            </div>
          </div>
          <button class="ios-btn ios-btn-tint ios-btn-full" type="submit">开始抓取</button>
        </form>
      </div>
      <!-- Sync User -->
      <div class="card">
        <div class="card-label">同步用户动态</div>
        <form id="sync-form">
          <div class="form-group">
            <label class="form-label" for="sync-user">用户 ID</label>
            <input class="form-input" id="sync-user" name="userId" placeholder="例如 mr-dang-77" value="mr-dang-77" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="sync-limit">同步数量</label>
            <input class="form-input" id="sync-limit" name="limit" type="number" min="1" value="3">
          </div>
          <div class="form-group">
            <div class="toggle-cell">
              <span>抓取评论</span>
              <label class="ios-switch"><input type="checkbox" id="sync-with-comments" checked><span class="switch-track"></span></label>
            </div>
          </div>
          <button class="ios-btn ios-btn-tint ios-btn-full" type="submit">开始同步</button>
        </form>
      </div>
    </div>
  </section>

  <!-- ===== Tasks ===== -->
  <section class="section" id="task-section">
    <div class="section-header">
      <span>任务队列</span>
      <button class="section-action" onclick="refreshTasks()">刷新</button>
    </div>
    <div class="card">
      <ul class="list" id="task-list"></ul>
    </div>
  </section>

  <!-- ===== Content Browser ===== -->
  <section class="section" id="content-section">
    <div class="section-header">
      <span>内容浏览</span>
      <button class="section-action" onclick="refreshOutputs()">刷新</button>
    </div>
    <div class="card">
      <div class="form-group" style="padding:12px 16px 4px">
        <label class="form-label" for="author-select">选择作者</label>
        <select class="form-input" id="author-select"></select>
      </div>
      <ul class="list" id="file-list"></ul>
      <div class="pager" id="pager"></div>
    </div>
  </section>

</div>

<!-- Tab Bar (mobile) -->
<nav class="tab-bar" aria-label="主导航">
  <div class="tab-bar-inner">
  <a class="tab-item" href="#crawl-section">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none"><path d="M13.828 10.172a4 4 0 0 0-5.656 0l-4 4a4 4 0 1 0 5.656 5.656l1.102-1.101" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M10.172 13.828a4 4 0 0 0 5.656 0l4-4a4 4 0 0 0-5.656-5.656l-1.1 1.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <span>抓取</span>
  </a>
  <a class="tab-item" href="#task-section">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="4" stroke="currentColor" stroke-width="2"/><path d="M8 12h8M8 8h8M8 16h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <span>任务</span>
  </a>
  <a class="tab-item" href="#content-section">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" stroke="currentColor" stroke-width="2"/></svg>
    <span>内容</span>
  </a>
  <a class="tab-item" href="javascript:void(0)" onclick="refreshAll()">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none"><path d="M4 12a8 8 0 0 1 14.12-5.12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M20 12a8 8 0 0 1-14.12 5.12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M18.36 4v3.64H14.73" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.64 20v-3.64h3.63" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>刷新</span>
  </a>
  </div>
</nav>

<!-- Toast (iOS HUD style) -->
<div class="ios-toast" id="toast" role="status" aria-live="polite"></div>

<script>
const $ = (s) => document.getElementById(s);
const toast = $('toast');
const taskList = $('task-list');
const fileList = $('file-list');
const pager = $('pager');
const authorSelect = $('author-select');
const syncUser = $('sync-user');

let qrSessionId = null, qrTimer = null;
let allFiles = [], pageSize = 20, pageIdx = 0;

const showToast = (msg) => {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
};
const fmt = (v) => v ? new Date(v).toLocaleString('zh-CN', {hour12:false}) : '--';

const fetchJson = async (url, opts={}) => {
  const r = await fetch(url, opts);
  if (!r.ok) { let t = r.statusText; try { const d = await r.json(); t = d.message||d.error||t; } catch(e) { t = await r.text(); } throw new Error(t); }
  return r.json();
};
const postJson = (url, body) => fetchJson(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: body ? JSON.stringify(body) : '{}' });

// Status
const refreshStatus = async () => {
  try {
    const d = await fetchJson('/api/zhihu/status');
    $('status-login').textContent = d.loggedIn ? '已登录' : '未登录';
    $('status-cookies').textContent = d.hasCookies ? '已保存' : '未保存';
  } catch(e) { $('status-login').textContent = '--'; $('status-cookies').textContent = '--'; }
};

// QR Login
const startQrLogin = async () => {
  try {
    if (qrTimer) clearInterval(qrTimer);
    const p = await postJson('/api/zhihu/login/qr/session');
    qrSessionId = p.sessionId;
    renderQr(p);
    qrTimer = setInterval(pollQr, 1800);
  } catch(e) { showToast(e.message); }
};
const stopQrLogin = async () => {
  if (qrSessionId) { try { await postJson('/api/zhihu/login/qr/session/'+encodeURIComponent(qrSessionId)+'/cancel'); } catch(e){} }
  if (qrTimer) clearInterval(qrTimer);
  qrSessionId = null;
  $('qr-login-state').textContent = '';
  $('qr-login-message').textContent = '';
  $('qr-login-image').style.display = 'none';
};
const renderQr = (p) => {
  const labels = {WAITING:'等待扫码',SCANNED:'已扫码',SUCCESS:'登录成功',EXPIRED:'已过期',FAILED:'失败'};
  $('qr-login-state').textContent = labels[p.status]||p.status||'';
  $('qr-login-message').textContent = p.message||'';
  if (p.qrImage) { $('qr-login-image').src = p.qrImage; $('qr-login-image').style.display = 'block'; }
};
const pollQr = async () => {
  if (!qrSessionId) return;
  try {
    const p = await fetchJson('/api/zhihu/login/qr/session/'+encodeURIComponent(qrSessionId));
    renderQr(p);
    if (['SUCCESS','EXPIRED','FAILED'].includes(p.status)) { clearInterval(qrTimer); qrTimer=null; if (p.status==='SUCCESS') refreshStatus(); }
  } catch(e) { clearInterval(qrTimer); qrTimer=null; qrSessionId=null; }
};

// Tasks
const fmtRemaining = (ms) => {
  if (!ms || ms <= 0) return '';
  const s = Math.ceil(ms / 1000);
  if (s < 60) return '约' + s + '秒';
  const m = Math.ceil(s / 60);
  return '约' + m + '分钟';
};

const chevronSvg = '<svg width="6" height="10" viewBox="0 0 6 10" fill="none"><path d="M1 1l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

const renderPhases = (phases) => {
  if (!phases || !Object.keys(phases).length) return '';
  let html = '<div class="phase-grid">';
  for (const [name, p] of Object.entries(phases)) {
    const pct = p.total > 0 ? Math.round((p.done / p.total) * 100) : 0;
    const color = p.failed > 0 ? 'var(--orange)' : p.done >= p.total ? 'var(--green)' : 'var(--tint)';
    let detail = '';
    if (p.remaining > 0) detail += '待处理 ' + p.remaining;
    if (p.failed > 0) detail += (detail ? ' · ' : '') + '失败 ' + p.failed;
    if (p.skipped > 0) detail += (detail ? ' · ' : '') + '跳过 ' + p.skipped;
    html += '<div class="phase-chip">'
      + '<div class="phase-name">' + name + '</div>'
      + '<div class="phase-bar"><div class="phase-track"><div class="phase-track-fill" style="width:'+pct+'%;background:'+color+'"></div></div>'
      + '<span class="phase-count">'+p.done+'/'+p.total+'</span></div>'
      + (detail ? '<div class="phase-detail">'+detail+'</div>' : '')
      + '</div>';
  }
  html += '</div>';
  return html;
};

const refreshTasks = async () => {
  try {
    const tasks = await fetchJson('/api/tasks');
    taskList.innerHTML = '';
    if (!tasks.length) { taskList.innerHTML = '<li class="list-cell empty">暂无任务</li>'; return; }
    tasks.slice(0,20).forEach((t, idx) => {
      const cls = t.status==='COMPLETED'?'tag-ok':t.status==='FAILED'?'tag-err':t.status==='RUNNING'?'tag-run':'tag-pending';
      const labels = {PENDING:'排队中',RUNNING:'进行中',COMPLETED:'已完成',FAILED:'失败'};
      const msg = t.error||t.message||'';

      const li = document.createElement('li');
      li.className = 'list-cell task-cell';

      let progressHtml = '';
      if (t.status === 'RUNNING') {
        const remaining = fmtRemaining(t.estimatedRemainingMs);
        const stepInfo = t.currentStep || '';
        progressHtml = '<div class="progress-track"><div class="progress-fill" style="width:'+t.progress+'%"></div></div>'
          + '<div class="progress-meta">'
          + (t.totalSteps > 0 ? t.completedSteps + '/' + t.totalSteps + ' 项' : '')
          + (remaining ? ' · 剩余' + remaining : '')
          + (stepInfo ? '<br>' + stepInfo : '')
          + '</div>'
          + renderPhases(t.phases);
      }

      let itemsHtml = '';
      if (t.completedItems && t.completedItems.length > 0) {
        const itemId = 'task-items-' + idx;
        const btnId = 'task-btn-' + idx;
        itemsHtml = '<button class="disclosure-btn" id="'+btnId+'" onclick="var l=document.getElementById(\''+itemId+'\'),b=document.getElementById(\''+btnId+'\');l.classList.toggle(\'open\');b.classList.toggle(\'open\')">'
          + chevronSvg + ' 已完成 ' + t.completedItems.length + ' 项</button>'
          + '<div class="disclosure-list" id="'+itemId+'">' + t.completedItems.map(i => '<div>'+i+'</div>').join('') + '</div>';
      }

      li.innerHTML = '<div class="task-head">'
        + '<div><div class="task-title">'+t.title+'</div>'
        + '<div class="task-sub">'+fmt(t.createdAt)+(msg && t.status!=='RUNNING'?' · '+msg:'')+'</div></div>'
        + '<span class="tag '+cls+'">'+(labels[t.status]||t.status)+'</span></div>'
        + progressHtml + itemsHtml;
      taskList.appendChild(li);
    });
  } catch(e) { showToast('任务加载失败'); }
};

// Content
const renderFilePage = () => {
  fileList.innerHTML = '';
  pager.innerHTML = '';
  if (!allFiles.length) { fileList.innerHTML = '<li class="list-cell empty">暂无内容</li>'; return; }
  const start = pageIdx * pageSize;
  const page = allFiles.slice(start, start + pageSize);
  page.forEach(f => {
    const li = document.createElement('li');
    li.className = 'list-cell file-cell';
    const typeLabel = f.type==='article'?'文章':f.type==='answer'?'回答':f.type==='pin'?'想法':f.type;
    const analyzed = f.analyzed ? ' · ✓ 已分析' : '';
    const target = f.relativePath;
    li.innerHTML = '<div class="file-head">'
      + '<div class="file-info"><a class="file-link" href="'+f.viewUrl+'" target="_blank">'+(f.name||'未知标题')+'</a>'
      + '<div class="file-meta">'+typeLabel+analyzed+' · '+fmt(f.lastModified)+'</div></div>'
      + '<div class="file-actions">'
      + (!f.analyzed ? '<button class="ios-btn-ghost ios-btn-sm" onclick="analyzeFile(\''+target+'\')">分析</button>' : '')
      + '<button class="ios-btn-danger ios-btn-sm" onclick="deleteFile(\''+target+'\')">删除</button>'
      + '</div></div>';
    fileList.appendChild(li);
  });
  const totalPages = Math.ceil(allFiles.length / pageSize);
  if (totalPages > 1) {
    pager.innerHTML = '<button class="pager-btn" '+(pageIdx<=0?'disabled':'')+' onclick="filePrev()">上一页</button>'
      + '<span>'+(pageIdx+1)+' / '+totalPages+'</span>'
      + '<button class="pager-btn" '+(pageIdx>=totalPages-1?'disabled':'')+' onclick="fileNext()">下一页</button>';
  }
};
const filePrev = () => { if (pageIdx>0) { pageIdx--; renderFilePage(); } };
const fileNext = () => { if (pageIdx < Math.ceil(allFiles.length/pageSize)-1) { pageIdx++; renderFilePage(); } };

const analyzeFile = async (target) => {
  try { await postJson('/api/zhihu/analyze', {file:target}); showToast('已提交分析任务'); refreshTasks(); } catch(e) { showToast(e.message); }
};

const deleteFile = async (target) => {
  if (!confirm('确定删除？关联的评论和AI分析结果也会一并删除。')) return;
  try {
    await fetchJson('/api/outputs/' + target, { method: 'DELETE' });
    showToast('已删除');
    refreshFiles(authorSelect.value);
  } catch(e) { showToast(e.message); }
};

const refreshFiles = async (author) => {
  if (!author) { allFiles=[]; renderFilePage(); return; }
  try { allFiles = await fetchJson('/api/outputs/'+encodeURIComponent(author)+'/files'); pageIdx=0; renderFilePage(); } catch(e) { showToast('加载失败'); }
};

const refreshOutputs = async () => {
  try {
    const prev = authorSelect.value;
    const authors = await fetchJson('/api/outputs');
    authorSelect.innerHTML = '';
    if (!authors.length) { authorSelect.innerHTML = '<option value="">暂无作者</option>'; allFiles=[]; renderFilePage(); return; }
    authors.forEach(a => { const o = document.createElement('option'); o.value = a.name; o.textContent = a.name+' ('+a.mdCount+')'; authorSelect.appendChild(o); });
    if (prev && [...authorSelect.options].some(o => o.value === prev)) { authorSelect.value = prev; }
    refreshFiles(authorSelect.value);
  } catch(e) { showToast('加载失败'); }
};

// Forms
$('fetch-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector('button[type=submit]');
  const url = $('fetch-url').value.trim();
  if (!url) { showToast('请输入链接'); return; }
  btn.disabled = true;
  try { await postJson('/api/zhihu/fetch', {url, save:true, withComments:$('fetch-with-comments').checked}); showToast('任务已创建'); refreshTasks(); } catch(e) { showToast(e.message); }
  finally { btn.disabled = false; }
});

$('sync-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector('button[type=submit]');
  const userId = syncUser.value.trim();
  if (!userId) { showToast('请输入用户ID'); return; }
  btn.disabled = true;
  try { await postJson('/api/zhihu/sync', {userId, limit:Number($('sync-limit').value||3), withComments:$('sync-with-comments').checked}); showToast('任务已创建'); refreshTasks(); } catch(e) { showToast(e.message); }
  finally { btn.disabled = false; }
});

authorSelect.addEventListener('change', (e) => refreshFiles(e.target.value));

const refreshAll = () => { refreshStatus(); refreshTasks(); refreshOutputs(); };

// Init
refreshAll();
setInterval(refreshTasks, 5000);
</script>

</body>
</html>
