<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>投资信息分析系统</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="page">

  <!-- ========== TAB 1: Crawl & Analysis ========== -->
  <div class="tab-panel" id="panel-crawl">

    <section class="section">
      <div class="section-header">数据抓取</div>
      <div class="card-grid">
        <div class="card">
          <div class="card-label">抓取链接</div>
          <form id="fetch-form">
            <div class="form-group">
              <label class="form-label" for="fetch-url">知乎链接</label>
              <input class="form-input" id="fetch-url" name="url" placeholder="https://www.zhihu.com/question/..." required>
            </div>
            <div class="form-group">
              <div class="toggle-cell"><span>抓取评论</span>
                <label class="ios-switch"><input type="checkbox" id="fetch-with-comments" checked><span class="switch-track"></span></label>
              </div>
            </div>
            <button class="ios-btn ios-btn-tint ios-btn-full" type="submit">开始抓取</button>
          </form>
        </div>
        <div class="card">
          <div class="card-label">同步用户动态</div>
          <form id="sync-form">
            <div class="form-group">
              <label class="form-label" for="sync-user">选择作者</label>
              <select class="form-input" id="sync-user" name="userId" required><option value="">请先添加作者</option></select>
            </div>
            <div class="form-group">
              <label class="form-label" for="sync-limit">同步数量</label>
              <input class="form-input" id="sync-limit" name="limit" type="number" min="1" value="3">
            </div>
            <div class="form-group">
              <div class="toggle-cell"><span>抓取评论</span>
                <label class="ios-switch"><input type="checkbox" id="sync-with-comments" checked><span class="switch-track"></span></label>
              </div>
            </div>
            <button class="ios-btn ios-btn-tint ios-btn-full" type="submit">开始同步</button>
          </form>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="section-header">
        <span>任务队列</span>
        <button class="section-action" onclick="refreshTasks()">刷新</button>
      </div>
      <div class="card">
        <ul class="list" id="task-list"></ul>
        <div class="pager" id="task-pager"></div>
      </div>
    </section>

  </div>

  <!-- ========== TAB 2: Search & Browse ========== -->
  <div class="tab-panel" id="panel-browse">

    <!-- Advanced Search Panel -->
    <section class="section" style="margin-top:12px;position:relative;z-index:10">
      <div class="card" style="padding:12px 16px;overflow:visible">
        <div class="adv-search-row">
          <div class="adv-field" style="flex:2">
            <label>关键词</label>
            <input id="search-input" placeholder="搜索文章、评论、AI分析...">
          </div>
          <div class="adv-field">
            <label>作者</label>
            <select id="search-author"><option value="">全部作者</option></select>
          </div>
          <div class="adv-field">
            <label>类型</label>
            <select id="search-type">
              <option value="">全部类型</option>
              <option value="article">文章</option>
              <option value="answer">回答</option>
              <option value="pin">想法</option>
              <option value="guba_post">股吧帖子</option>
            </select>
          </div>
        </div>
        <div class="adv-search-row" style="margin-top:6px">
          <div class="adv-field" style="flex:1;position:relative">
            <label>标签</label>
            <div class="tag-select-chips" id="search-tag-chips" onclick="toggleSearchTagDropdown(event)">
              <span class="tag-placeholder">点击选择标签</span>
            </div>
            <div class="tag-picker-dropdown" id="search-tag-dropdown"></div>
          </div>
          <div style="display:flex;gap:6px;flex-shrink:0;align-items:flex-end;margin-bottom:1px">
            <button class="ios-btn ios-btn-tint ios-btn-sm" onclick="doSearch()" style="height:34px">搜索</button>
            <button class="ios-btn ios-btn-plain ios-btn-sm" onclick="resetSearch()" style="height:34px">重置</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Results -->
    <section class="section">
      <div class="section-header">
        <span id="browse-title">全部内容</span>
        <span>
          <button class="section-action" id="select-all-btn" onclick="toggleSelectAll()" style="margin-right:8px">全选</button>
        </span>
      </div>
      <div class="export-toolbar" id="export-toolbar">
        <span class="export-toolbar-info" id="export-toolbar-info">已选 0 项</span>
        <div style="display:flex;gap:6px">
          <button class="ios-btn ios-btn-tint ios-btn-sm" onclick="openExportModal()">导出</button>
          <button class="ios-btn ios-btn-plain ios-btn-sm" onclick="openBatchTagModal()">打标签</button>
          <button class="ios-btn ios-btn-sm" style="background:var(--red-bg);color:var(--red)" onclick="doBatchDelete()">删除</button>
        </div>
      </div>
      <div class="card">
        <ul class="list" id="browse-results"></ul>
        <div class="pager" id="browse-pager"></div>
      </div>
    </section>

  </div>

  <!-- Export Modal -->
  <div class="modal-overlay" id="export-modal">
    <div class="modal-box">
      <div class="modal-title">导出选项</div>
      <div class="modal-option"><span>正文内容</span>
        <label class="ios-switch"><input type="checkbox" id="export-body" checked><span class="switch-track"></span></label>
      </div>
      <div class="modal-option"><span>评论</span>
        <label class="ios-switch"><input type="checkbox" id="export-comments"><span class="switch-track"></span></label>
      </div>
      <div class="modal-option"><span>AI 分析</span>
        <label class="ios-switch"><input type="checkbox" id="export-ai" checked><span class="switch-track"></span></label>
      </div>
      <div class="modal-actions">
        <button class="ios-btn ios-btn-plain" onclick="closeExportModal()">取消</button>
        <button class="ios-btn ios-btn-tint" onclick="doBatchExport()">确认导出</button>
      </div>
    </div>
  </div>

  <!-- Batch Tag Modal -->
  <div class="modal-overlay" id="batch-tag-modal">
    <div class="modal-box">
      <div class="modal-title">批量打标签</div>
      <div id="batch-tag-list" style="display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;min-height:40px"></div>
      <div class="modal-actions">
        <button class="ios-btn ios-btn-plain" onclick="closeBatchTagModal()">取消</button>
        <button class="ios-btn ios-btn-tint" onclick="doBatchTag()">确认</button>
      </div>
    </div>
  </div>

  <!-- ========== TAB 3: Manage ========== -->
  <div class="tab-panel" id="panel-manage">

    <!-- Login Status -->
    <section class="section">
      <div class="section-header">登录状态</div>
      <div class="card">
        <div class="cell-group">
          <div class="cell"><span class="cell-label">登录状态</span><span class="cell-value" id="status-login">--</span></div>
          <div class="cell"><span class="cell-label">Cookies</span><span class="cell-value" id="status-cookies">--</span></div>
        </div>
      </div>
      <div class="card" style="margin-top:8px">
        <div class="qr-zone">
          <div class="qr-actions">
            <button class="ios-btn ios-btn-tint" onclick="startQrLogin()">扫码登录</button>
            <button class="ios-btn ios-btn-plain" onclick="stopQrLogin()">结束会话</button>
            <span class="qr-state" id="qr-login-state"></span>
          </div>
          <img id="qr-login-image" class="qr-img" alt="QR">
          <div class="qr-message" id="qr-login-message"></div>
        </div>
      </div>
    </section>

    <!-- Author Management -->
    <section class="section">
      <div class="section-header">作者管理</div>
      <div class="card">
        <div class="form-group" style="padding:12px 16px 8px">
          <label class="form-label">添加作者</label>
          <div style="display:flex;gap:8px">
            <input class="form-input" id="author-url-input" placeholder="https://www.zhihu.com/people/xxx" style="flex:1">
            <button class="ios-btn ios-btn-tint ios-btn-sm" onclick="addAuthor()" id="add-author-btn">添加</button>
          </div>
        </div>
        <ul class="list" id="author-list"></ul>
      </div>
    </section>

    <!-- Tag Management -->
    <section class="section">
      <div class="section-header">标签管理</div>
      <div class="card">
        <div class="tag-mgmt-list" id="tag-mgmt-list"></div>
        <div class="tag-add-row">
          <input type="text" id="tag-name-input" placeholder="新标签名称">
          <input type="color" id="tag-color-input" value="#007AFF" title="选择颜色">
          <button class="ios-btn ios-btn-tint ios-btn-sm" onclick="createTag()">添加</button>
        </div>
      </div>
    </section>

  </div>

</div><!-- .page -->

<!-- ===== Tab Bar ===== -->
<nav class="tab-bar" aria-label="主导航">
  <div class="tab-bar-inner">
    <button class="tab-item" data-tab="crawl">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none"><path d="M13.828 10.172a4 4 0 0 0-5.656 0l-4 4a4 4 0 1 0 5.656 5.656l1.102-1.101" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M10.172 13.828a4 4 0 0 0 5.656 0l4-4a4 4 0 0 0-5.656-5.656l-1.1 1.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>抓取</span>
    </button>
    <button class="tab-item" data-tab="browse">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>浏览</span>
    </button>
    <button class="tab-item" data-tab="manage">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" stroke="currentColor" stroke-width="2"/></svg>
      <span>管理</span>
    </button>
  </div>
</nav>

<div class="ios-toast" id="toast" role="status" aria-live="polite"></div>

<script src="/app.js"></script>
<script src="/crawl.js"></script>
<script src="/browse.js"></script>
<script src="/manage.js"></script>
</body>
</html>
