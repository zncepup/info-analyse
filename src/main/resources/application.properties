app.name=info-analyse

# Crawler
crawl.userAgent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Safari/537.36
crawl.timeoutMs=10000
crawl.intervalMinutes=30
crawl.sources=zhihu,xueqiu,wechat
crawl.outputPath=data/articles.jsonl
crawl.maxPerSource=30

# Source configuration (CSS selectors)
source.zhihu.name=Zhihu Hot
source.zhihu.url=https://www.zhihu.com/hot
source.zhihu.articleSelector=div.HotList-item
source.zhihu.titleSelector=div.HotList-itemTitle
source.zhihu.linkSelector=a
source.zhihu.summarySelector=div.HotList-itemExcerpt

source.xueqiu.name=Xueqiu Home
source.xueqiu.url=https://xueqiu.com/
source.xueqiu.articleSelector=article
source.xueqiu.titleSelector=a
source.xueqiu.linkSelector=a
source.xueqiu.summarySelector=p

source.wechat.name=WeChat Articles
source.wechat.url=https://mp.weixin.qq.com/
source.wechat.articleSelector=article
source.wechat.titleSelector=h2
source.wechat.linkSelector=a
source.wechat.summarySelector=p

# Analysis
analysis.positiveKeywords=earnings,beat,upgrade,record,\u4e1a\u7ee9,\u589e\u957f,\u521b\u65b0\u9ad8,\u56de\u8d2d
analysis.negativeKeywords=miss,downgrade,loss,warning,\u4e0b\u6ed1,\u4e8f\u635f,\u8b66\u544a,\u51cf\u503c
analysis.minScore=2
analysis.topN=20
analysis.marketKeywords.ashare=\u0041\u80a1,\u6caa\u6df1
analysis.marketKeywords.hshare=\u6e2f\u80a1,\u9999\u6e2f
analysis.marketKeywords.usshare=\u7f8e\u80a1,NASDAQ,NYSE

